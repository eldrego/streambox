name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Enable task distribution via Nx Cloud
      # Uncomment to enable distributed task execution
      # - run: pnpm nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: pnpm nx-cloud record -- echo Hello World
      - run: pnpm nx run-many -t lint test build

      # Nx Cloud recommends fixes for failures to help you get CI green faster.
      - run: pnpm nx fix-ci
        if: always()

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shell Docker image
        env:
          VITE_NEW_RELIC_ACCOUNT_ID: ${{ secrets.VITE_NEW_RELIC_ACCOUNT_ID }}
          VITE_NEW_RELIC_TRUST_KEY: ${{ secrets.VITE_NEW_RELIC_TRUST_KEY }}
          VITE_NEW_RELIC_AGENT_ID: ${{ secrets.VITE_NEW_RELIC_AGENT_ID }}
          VITE_NEW_RELIC_LICENSE_KEY: ${{ secrets.VITE_NEW_RELIC_LICENSE_KEY }}
          VITE_NEW_RELIC_APP_ID: ${{ secrets.VITE_NEW_RELIC_APP_ID }}
        run: |
          docker build \
            --file shell/Dockerfile \
            --build-arg VITE_REMOTE_MUSIC_URL=http://localhost:4201/assets/remoteEntry.js \
            --build-arg VITE_REMOTE_MOVIES_URL=http://localhost:4202/assets/remoteEntry.js \
            --build-arg VITE_NEW_RELIC_ACCOUNT_ID \
            --build-arg VITE_NEW_RELIC_TRUST_KEY \
            --build-arg VITE_NEW_RELIC_AGENT_ID \
            --build-arg VITE_NEW_RELIC_LICENSE_KEY \
            --build-arg VITE_NEW_RELIC_APP_ID \
            --tag streambox/shell:ci \
            .
